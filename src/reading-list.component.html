<section>
  <appbar pin tone="tint" title="Reading list" back (back)="goBack()"></appbar>
  <p>Scroll to the end and the next page of articles appends on its own.</p>
  <p>Showing {{ items.length }} of {{ total }} articles.</p>
  <list haptic (endReached)="loadMore()">
    <row *ngFor="let a of items" [title]="a.title" [subtitle]="a.sub"></row>
  </list>
  <p *ngIf="done">That is the whole list: {{ items.length }} articles.</p>
  <button *ngIf="done" (click)="reset()">Start the list again</button>
</section>
