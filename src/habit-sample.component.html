<section>
  <appbar pin tone="tint" title="Habit tracker" back (back)="goBack()"></appbar>
  <card class="readout">
    <h3>{{ doneCount }} of {{ rows.length }} done today</h3>
    <progress-bar [value]="percent"></progress-bar>
    <p>A new day starts unticked. Nothing carries over, and nothing is owed.</p>
  </card>
  <section *ngFor="let r of rows; let i = index" class="habit-row">
    <section class="check-hit" (click)="toggle(i)">
      <section class="check" [class.check-on]="r.done">
        <icon *ngIf="r.done" name="check" color="onPrimary" size="20"></icon>
      </section>
    </section>
    <p class="habit-name">{{ r.name }}</p>
    <button variant="text" (click)="remove(i)">Remove</button>
  </section>
  <p *ngIf="rows.length === 0">No habits yet. Add your first one below.</p>
  <input label="New habit" placeholder="e.g. Walk for 15 minutes" [(ngModel)]="newName">
  <button (click)="add()" [disabled]="newName === ''">Add habit</button>
</section>
