<section>
  <appbar pin tone="tint" title="Alarm" back (back)="goBack()"></appbar>
  <section *ngIf="alarm.ringing">
    <card class="ring-card">
      <p class="ring-label">ALARM</p>
      <p class="ring-time">{{ timeLabel }}</p>
      <h3>{{ alarm.title }}</h3>
      <section class="ring-actions">
        <button color="danger" (click)="stop()">Stop</button>
        <button color="neutral" (click)="snooze()">Snooze 5 min</button>
      </section>
    </card>
  </section>
  <section *ngIf="!alarm.ringing">
    <card class="alarm-card">
      <section class="alarm-top">
        <section class="alarm-main">
          <h3>{{ alarm.title }}</h3>
          <p class="alarm-time">{{ timeLabel }}</p>
          <p class="badge">{{ daysLabel }}</p>
        </section>
        <switch [checked]="alarm.enabled" (change)="onSwitch($event)"></switch>
      </section>
    </card>
    <card class="settings-card">
      <label>When</label>
      <datetime-picker label="Time" mode="time" [value]="alarm.timeIso" (change)="setTime($event)"></datetime-picker>
      <label>Repeat</label>
      <section class="chips-row">
        <section *ngFor="let c of dayChips" class="chip" [class.chip-on]="c.on" (click)="toggleDay(c.d)">
          <p class="chip-text" [class.chip-text-on]="c.on">{{ c.name }}</p>
        </section>
      </section>
      <input label="Alarm title" placeholder="Wake up" [(ngModel)]="titleDraft" (change)="applyTitle($event)">
      <p *ngIf="titleDraft.length > 40">{{ 50 - titleDraft.length }} characters left.</p>
    </card>
    <p class="note">It rings on this page while the app is open, with vibration. It does not ring when the app is closed.</p>
  </section>
</section>
