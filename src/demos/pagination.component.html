<section class="launch" (click)="openList()">
  <section class="launch-row">
    <section class="launch-icon">
      <icon name="menu" size="24" color="primary"></icon>
    </section>
    <section class="launch-text">
      <p class="launch-title">Open the paged list</p>
      <p class="launch-sub">Numbered pages, with a place to return to.</p>
    </section>
    <icon name="chevron-right" size="24"></icon>
  </section>
  <section class="launch-pills">
    <section class="pill">
      <p class="pill-text">60 articles</p>
    </section>
    <section class="pill">
      <p class="pill-text">12 pages</p>
    </section>
  </section>
</section>
