<section class="panel">
  <label>The log, read from the service</label>
  <p *ngIf="log.entries.length === 0">Nothing logged yet. Tap a button below and the first entry lands here at once.</p>
  <p *ngFor="let e of log.entries">{{ e.name }}: {{ e.minutes }} min</p>
  <p>{{ log.entries.length }} entries. Total today: {{ log.total }} min</p>
</section>
