<stepper [index]="stepIndex" (change)="onStep($event)">
  <step label="Activity">
    <p>Pick the activity you want to schedule.</p>
    <button (click)="pick('Morning run')">Morning run</button>
    <button (click)="pick('Evening walk')">Evening walk</button>
  </step>
  <step label="Time">
    <p *ngIf="activity">Activity: {{ activity }}. It sits at 7 am, before the day starts.</p>
    <p *ngIf="!activity">No activity picked yet. Go back one step and pick one.</p>
    <button variant="text" (click)="back()">Back</button>
    <button (click)="next()">Continue</button>
  </step>
  <step label="Done">
    <p *ngIf="activity">All set: {{ activity }} is scheduled at 7 am.</p>
    <p *ngIf="!activity">Nothing is scheduled. Pick an activity in the first step.</p>
    <button variant="text" (click)="back()">Back</button>
  </step>
</stepper>
