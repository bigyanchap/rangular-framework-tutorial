<p *ngIf="!noteDeleted">Note: Book the meeting room for Saturday.</p>
<p *ngIf="noteDeleted">The note was deleted.</p>
<button *ngIf="!noteDeleted" (click)="openConfirm()">Delete the note</button>
<button *ngIf="noteDeleted" (click)="restore()">Restore the note</button>
<dialog [open]="confirmOpen" (close)="closeConfirm()" title="Delete this note?">
  <p>The note leaves the list. You can restore it afterwards from this screen.</p>
  <actions>
    <button color="neutral" (click)="closeConfirm()">Cancel</button>
    <button color="danger" (click)="deleteNote()">Delete</button>
  </actions>
</dialog>
<button (click)="openRegister()">Create an account</button>
<p *ngIf="registered">Registered: {{ registered }}</p>
<dialog [open]="registerOpen" (close)="closeRegister()" title="Create your account">
  <input label="Name" placeholder="Your name" [(ngModel)]="name">
  <input label="Email" type="email" placeholder="you@example.com" [(ngModel)]="email">
  <input label="Password" type="password" placeholder="At least 6 characters" [(ngModel)]="password">
  <actions>
    <button color="neutral" (click)="closeRegister()">Cancel</button>
    <button (click)="register()">Register</button>
  </actions>
</dialog>
