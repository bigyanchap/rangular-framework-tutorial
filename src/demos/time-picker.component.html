<datetime-picker label="Reminder time" mode="time" minuteInterval="5" [value]="at" (change)="onAt($event)"></datetime-picker>
<p>Time value (ISO): {{ at }}</p>
<datetime-picker label="Date and time (sheet)" presentation="sheet" [value]="when" (change)="onWhen($event)"></datetime-picker>
<p>Sheet datetime value (ISO): {{ when }}</p>
<datetime-picker label="Date and time (modal)" presentation="modal" [value]="whenModal" (change)="onWhenModal($event)"></datetime-picker>
<p>Modal datetime value (ISO): {{ whenModal }}</p>
