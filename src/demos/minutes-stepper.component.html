<label>Add minutes</label>
<section class="btnrow">
  <app-device-key glyph="+15" label="minutes" (pressed)="add15()"></app-device-key>
  <app-device-key glyph="+30" label="minutes" (pressed)="add30()"></app-device-key>
  <app-device-key glyph="reset" label="to zero" (pressed)="reset()"></app-device-key>
</section>
