<input label="Lesson number" placeholder="Type a number from 1 to 65" [(ngModel)]="target">
<button (click)="go()" [disabled]="target === ''">Go to that lesson</button>
<button (click)="goHistory()">History, by navigateByUrl</button>
<button (click)="goHome()">Home, by navigate</button>
<section class="array-group">
  <p class="array-title">Send an array along</p>
  <section class="console-box">
    <p class="console-text">[{{ langsText() }}]</p>
  </section>
  <button (click)="goStack()">Navigate With Array</button>
</section>
