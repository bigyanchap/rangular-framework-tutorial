<section class="panel">
  <label>The log, read from the service</label>
  <p *ngIf="log.entries.length === 0">The log is empty. Add your first activity below.</p>
  <section *ngFor="let e of log.entries">
    <row [title]="e.name" [subtitle]="e.minutes + ' min'"></row>
    <button (click)="remove(e)">Remove</button>
  </section>
  <p>Total today: {{ log.total }} min</p>
</section>
<input label="Activity" placeholder="e.g. Reading" [(ngModel)]="name">
<p>Minutes: {{ minutes === 0 ? 'not picked yet' : minutes }}</p>
<section class="btnrow">
  <button class="sq" (click)="pickMinutes(10)">10</button>
  <button class="sq" (click)="pickMinutes(15)">15</button>
  <button class="sq" (click)="pickMinutes(20)">20</button>
  <button class="sq" (click)="pickMinutes(30)">30</button>
</section>
<button (click)="add()" [disabled]="name === '' || minutes === 0">Add to the log</button>
