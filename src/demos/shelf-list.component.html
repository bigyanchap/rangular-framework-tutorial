<section class="panel">
  <label>The shelf, as the list renders it</label>
  <p>Local changes in this component: {{ taps }}</p>
  <p>The key under this panel makes one. It changes nothing in the service.</p>
</section>
<section class="btnrow">
  <app-device-key [square]="true" glyph="tap" label="local change" (pressed)="tap()"></app-device-key>
</section>
<list>
  <row *ngFor="let item of shelf.items" [title]="item"></row>
</list>
