<section class="launch" (click)="openList()">
  <section class="launch-row">
    <section class="launch-icon">
      <icon name="file" size="24" color="primary"></icon>
    </section>
    <section class="launch-text">
      <p class="launch-title">Open the thousand messages</p>
      <p class="launch-sub">Fifteen rows, reused all the way down.</p>
    </section>
    <icon name="chevron-right" size="24"></icon>
  </section>
  <section class="launch-pills">
    <section class="pill">
      <p class="pill-text">1,000 messages</p>
    </section>
    <section class="pill">
      <p class="pill-text">15 rows</p>
    </section>
  </section>
</section>
