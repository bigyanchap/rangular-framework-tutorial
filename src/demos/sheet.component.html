<p *ngIf="!alarm">No alarm yet.</p>
<p *ngIf="alarm">Alarm set: {{ alarm }}</p>
<p *ngIf="alarm">Time (ISO): {{ time }}</p>
<button (click)="openSheet()">Set an alarm</button>
<sheet [open]="sheetOpen" (close)="closeSheet()">
  <label>Alarm</label>
  <datetime-picker label="Time" mode="time" minuteInterval="5" [value]="time" (change)="onTime($event)"></datetime-picker>
  <input label="Label" placeholder="Wake up" [(ngModel)]="label">
  <label>Sound</label>
  <radio-group [value]="sound" (change)="onSound($event)">
    <radio value="bell">Bell</radio>
    <radio value="chime">Chime</radio>
    <radio value="waves">Waves</radio>
  </radio-group>
  <switch [checked]="vibrate" (change)="onVibrate($event)">Vibrate</switch>
  <actions>
    <button color="neutral" (click)="closeSheet()">Cancel</button>
    <button (click)="save()">Save alarm</button>
  </actions>
</sheet>
