<section>
  <appbar pin tone="tint" title="Platformer" back (back)="goBack()"></appbar>
  <card class="readout">
    <h3>Coins {{ game.coins }} · Lives {{ game.lives }}</h3>
    <p>{{ game.stateLine }}</p>
    <p>Tap an arrow to run that way. Tap it again to stop. Jump with the up key. Stomp a walker by landing on it.</p>
  </card>
  <section class="stage">
    <section *ngFor="let row of game.view" class="trow">
      <section *ngFor="let c of row" class="cell sky" [class.ground]="c === '#'" [class.brick]="c === 'B'" [class.qblock]="c === '?'" [class.pipe]="c === 'P'" [class.plat]="c === '='" [class.coin]="c === 'o'" [class.pole]="c === '|'" [class.flag]="c === 'F'" [class.enemy]="c === 'E'" [class.player]="c === 'X'">
        <section *ngIf="c === 'X'">
          <section class="cap"></section>
          <section class="face"></section>
        </section>
      </section>
    </section>
  </section>
  <section class="keys-row">
    <app-device-key glyph="<" label="left" (pressed)="goLeft()"></app-device-key>
    <app-device-key glyph="^" label="jump" (pressed)="jump()"></app-device-key>
    <app-device-key glyph=">" label="right" (pressed)="goRight()"></app-device-key>
  </section>
  <button variant="text" (click)="restart()">Restart level</button>
</section>
